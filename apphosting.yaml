# Firebase App Hosting configuration
runtime: nodejs20

build:
  commands:
    - npm install
    - npm run build

run:
  commands:
    - npm start

runConfig:
  minInstances: 1
  maxInstances: 10
  cpu: 1
  memoryMiB: 512

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: PORT
    value: "8080"
    availability:
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: veamos-tv
    availability:
      - RUNTIME
  - variable: JWT_EXPIRES_IN
    value: 7d
    availability:
      - RUNTIME
  - variable: JWT_REFRESH_EXPIRES_IN
    value: 30d
    availability:
      - RUNTIME
  - variable: SCRAPE_INTERVAL_MINUTES
    value: "30"
    availability:
      - RUNTIME

# Secret environment variables (set in Firebase Console)
# - JWT_SECRET
# - FIREBASE_CLIENT_EMAIL
# - FIREBASE_PRIVATE_KEY
# - FIREBASE_DATABASE_URL
# - REDIS_URL
