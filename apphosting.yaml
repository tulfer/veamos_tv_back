# Firebase App Hosting configuration
runtime: nodejs20

build:
  commands:
    - npm install
    - npm run build

run:
  commands:
    - node dist/main.js

runConfig:
  minInstances: 1
  maxInstances: 10
  cpu: 1
  memoryMiB: 512

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: PORT
    value: "8080"
    availability:
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: veamos-tv
    availability:
      - RUNTIME
  - variable: JWT_EXPIRES_IN
    value: 7d
    availability:
      - RUNTIME
  - variable: JWT_REFRESH_EXPIRES_IN
    value: 30d
    availability:
      - RUNTIME
  - variable: SCRAPE_INTERVAL_MINUTES
    value: "30"
    availability:
      - RUNTIME

  - variable: JWT_SECRET
    secret: JWT_SECRET
    availability:
      - RUNTIME


